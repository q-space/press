[package]
name = "qspace-press-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "0.12", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
bcrypt = "0.15"
reqwest = { version = "0.12", features = ["json"] }
redis = { version = "0.25", features = ["tokio-comp"] }
aws-sdk-s3 = "1"
# DEVIATION from the canon doc's `stripe-rust = "0.12.x"`: every published
# version of that crate transitively depends on hmac@0.6.3 -> crypto-mac,
# and every 0.6.x crypto-mac release is yanked from crates.io -- the crate
# is unbuildable today, confirmed via `cargo check`, not assumed. Swapped
# to `async-stripe`, the actively maintained fork of the same API surface
# (same publisher lineage, still called `stripe` in code via its crate
# name). Nothing calls the Stripe API yet (Cycle 3 scope, per
# payments/stripe.rs's own doc comment), so this has zero blast radius
# today -- flagged for whoever implements payments/stripe.rs for real.
async-stripe = { version = "0.41", features = ["runtime-tokio-hyper-rustls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
validator = { version = "0.16", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
# BB26091203: the generation engine's naming.rs needs a calendar date for
# filenames (YYYYMMDD) -- chrono is the standard choice; not previously
# declared directly even though sea-orm likely pulls it in transitively.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# BB26091203: DOCX/PDF renderers -- see render_docx.rs/render_pdf.rs doc
# comments for why these specific crates over the alternatives.
docx-rs = "0.4"
genpdf = "0.2"
# BB26091205: docx/pdf renders come back through the JSON `/archetypes/*`
# API base64-encoded (binary in a JSON response body needs an encoding);
# base64 is the crate every other Rust HTTP stack reaches for, no reason
# to hand-roll it.
base64 = "0.22"

[lib]
name = "qspace_press_api"
path = "src/lib.rs"

[[bin]]
name = "qspace-press-api"
path = "src/main.rs"

# BB26091205: operator CLI to mint a D-010 thin-client token -- see its
# own doc comment for why this is a CLI and not (yet) an HTTP endpoint.
[[bin]]
name = "mint_token"
path = "src/bin/mint_token.rs"
